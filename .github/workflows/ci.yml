name: CI

on: [push, pull_request]

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core, tests, benchmark; no raylib)
        run: cmake -S . -B build -DARENA_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark
        shell: bash
        run: |
          exe=build/bench_spatial; [ -f build/Release/bench_spatial.exe ] && exe=build/Release/bench_spatial.exe
          $exe

  game-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build the game
        run: |
          cmake -S . -B build -DARENA_BUILD_TESTS=OFF -DARENA_BUILD_BENCH=OFF
          cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: IroncladArena-windows
          path: |
            build/Release/ironclad_arena.exe
            build/Release/data/
